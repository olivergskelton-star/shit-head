name: Materialize direct table assets

on:
  push:
    branches:
      - fix/atlas-visible-render-0926
    paths:
      - scripts/materialize_table_assets.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlas-visible-render-0926
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Materialize PNG files
        run: python scripts/materialize_table_assets.py

      - name: Commit direct assets and retire atlas transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/table/*.png
          git rm -r assets/atlas
          git rm scripts/materialize_table_assets.py
          git rm .github/workflows/materialize-table-assets.yml
          git commit -m "Materialize direct tabletop PNG assets"
          git push origin HEAD:fix/atlas-visible-render-0926
