name: Join connection checks
on:
  pull_request:
    paths:
      - 'multiplayer*.js'
      - 'tests/functional/join-lifecycle.spec.js'
      - '.github/workflows/join-connections.yml'
jobs:
  join-connections:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/functional/join-lifecycle.spec.js tests/functional/three-browser.spec.js tests/functional/four-player-room.spec.js
