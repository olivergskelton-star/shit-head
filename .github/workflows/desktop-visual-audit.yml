name: Desktop visual audit

on:
  push:
    branches:
      - audit/desktop-0922-visual
  workflow_dispatch:

jobs:
  capture-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop views
        run: npx playwright test tests/functional/desktop-visual-capture.spec.js

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-audit-0922
          path: visual-audit/
          if-no-files-found: error
          retention-days: 7
