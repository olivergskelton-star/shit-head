<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17342a" />
  <title>Shit Head</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .hand button.card.selected {
      transform: translateY(-14px);
      box-shadow: 0 14px 26px rgba(0,0,0,.38), 0 0 0 4px var(--accent);
    }
    .play-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 10px;
      flex-wrap: wrap;
    }
    .play-selected {
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: rgba(0,0,0,.48);
      color: #fff;
      padding: 9px 16px;
      font-weight: 800;
    }
    .play-selected:disabled { opacity: .4; cursor: default; }
    .selection-hint { color: rgba(255,255,255,.7); font-size: .76rem; }
  </style>
</head>
<body data-theme="kitchen">
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Friday Night</p>
        <h1>Shit Head</h1>
      </div>
      <div class="controls">
        <label>
          Venue
          <select id="themeSelect">
            <option value="kitchen">Kitchen Table</option>
            <option value="pub">Pub</option>
            <option value="casino">Casino</option>
          </select>
        </label>
        <label>
          View as
          <select id="viewerSelect"></select>
        </label>
      </div>
    </header>

    <section class="room-stage" aria-label="Card table">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>

      <div id="table" class="table">
        <section id="opponentLeft" class="seat seat-opponent seat-left"></section>
        <section id="opponentRight" class="seat seat-opponent seat-right"></section>

        <section class="centre-zone" aria-label="Centre piles">
          <button id="drawPile" class="pile pile-draw" type="button" aria-label="Draw a card">
            <span class="card card-back stacked"></span>
            <span id="drawCount" class="pile-count"></span>
          </button>

          <div class="pile-wrap">
            <div id="discardPile" class="pile pile-discard" aria-label="Discard pile"></div>
            <span class="pile-label">Discard</span>
          </div>
        </section>

        <section id="playerSeat" class="seat seat-player"></section>
      </div>
    </section>

    <footer class="statusbar">
      <p id="statusText" aria-live="polite"></p>
      <button id="newGameBtn" type="button">New deal</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
